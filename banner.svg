<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://w3.org">
  <defs>
    <!-- Cyan Neon Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f3ff" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00f3ff" flood-opacity="0.6"/>
    </filter>

    <!-- Pink Neon Glow Filter -->
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007f" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff007f" flood-opacity="0.6"/>
    </filter>

    <!-- Background Cyberpunk Grid -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#151524" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Obsidian Base & Grid -->
  <rect width="1200" height="180" rx="8" fill="#07070c"/>
  <rect width="1200" height="180" rx="8" fill="url(#cyberGrid)"/>

  <!-- Neon Cyan Border & Pink Accent Line -->
  <rect x="3" y="3" width="1194" height="174" rx="6" fill="none" stroke="#00f3ff" stroke-width="2"/>
  <line x1="20" y1="168" x2="1180" y2="168" stroke="#ff007f" stroke-width="2"/>

  <!-- Flickering Pink Brackets -->
  <text x="600" y="96" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="62" letter-spacing="8">
    <tspan fill="#ff007f" filter="url(#glowPink)">[ <animate attributeName="opacity" values="1;1;0.4;1;1;0.6;1" dur="4s" repeatCount="indefinite"/></tspan>
    <tspan fill="#00f3ff" filter="url(#glowCyan)">NPX-CLEANER<animate attributeName="opacity" values="1;0.45;1;1;1;0.5;1" dur="5s" repeatCount="indefinite"/></tspan>
    <tspan fill="#ff007f" filter="url(#glowPink)"> ]<animate attributeName="opacity" values="1;1;0.4;1;1;0.6;1" dur="4s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- Matrix Terminal Subtitle -->
  <text x="600" y="140" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="16" letter-spacing="4" fill="#00ff41">
    NUPIXEL // NEXT-GEN FIVEM CACHE PURGE &amp; OPTIMIZER // BY CICADA
  </text>
</svg>
